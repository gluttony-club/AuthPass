name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          GOOS=darwin CGO_ENABLED=0 staticcheck ./...
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: ./test/e2e.sh
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      # Tests use secret.NewFile and temporary directories; they never touch the login keychain.
      - name: Test (cgo)
        run: CGO_ENABLED=1 go test ./...
      - name: Test (cgo, race)
        run: CGO_ENABLED=1 go test -race ./...
      - name: Test (no cgo)
        run: CGO_ENABLED=0 go test ./...
      - name: Staticcheck (cgo)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - run: ./build-mac.sh
      - name: Check universal binary
        run: |
          lipo -archs dist/AuthPass.app/Contents/MacOS/authpass
          lipo dist/AuthPass.app/Contents/MacOS/authpass -verify_arch arm64 x86_64
      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/AuthPass.app dist/AuthPass.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuthPass-macos
          path: dist/AuthPass.app.zip
