name: Release

# 推送 v* 标签时在 macOS 上构建 DMG，生成 SHA256SUMS 和构建来源证明，
# 并上传到同名 Release。
# - Release 不存在：创建为草稿（draft），由维护者补充说明后手动发布。
# - Release 已存在（例如先手动执行了 gh release create）：不重复创建，
#   用 --clobber 覆盖上传同名资源，以 CI 构建的 DMG 为准。

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Test
        run: CGO_ENABLED=1 go test ./...
      - name: Build DMG
        run: |
          VERSION=${TAG#v}
          [[ $VERSION =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
          VERSION=$VERSION ./build-mac.sh --dmg
          lipo dist/AuthPass.app/Contents/MacOS/authpass -verify_arch arm64 x86_64
          test -s dist/AuthPass.dmg
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 AuthPass.dmg > SHA256SUMS
          cat SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/AuthPass.dmg
      - name: Upload to release
        run: |
          assets=(dist/AuthPass.dmg dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            sum=$(cut -d' ' -f1 dist/SHA256SUMS)
            # shellcheck disable=SC2016 # 反引号是 Markdown 代码格式，不是命令替换
            notes=$(printf '通用版（Apple Silicon + Intel），要求 macOS 13 及以上。\n\nSHA256（AuthPass.dmg）：`%s`\n\n校验：`shasum -a 256 -c SHA256SUMS`' "$sum")
            # 并发时 create 可能因 Release 已存在而失败，此时回退为覆盖上传。
            gh release create "$TAG" "${assets[@]}" --draft --verify-tag \
              --title "AuthPass ${TAG#v}" --notes "$notes" \
              || gh release upload "$TAG" "${assets[@]}" --clobber
          fi
