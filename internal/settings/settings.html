<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AuthPass 设置</title>
<style>body{font:16px system-ui;margin:40px auto;padding:0 20px;max-width:1100px;color:#243047}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}input{max-width:160px;padding:7px}button{margin:8px;padding:8px 16px;cursor:pointer}#message{white-space:pre-wrap}small{color:#586477}</style>
<h1>AuthPass 设置</h1><p id="status"></p><p>规则按顺序匹配主机名前缀，忽略大小写和端口。建议前缀以「.」结尾。用户名为空时不拦截；密码编辑留空保留原值。</p>
<p><label><input type="checkbox" id="login">开机自动启动</label><button id="save-login">保存开机自启设置</button><span id="login-error" role="status"></span></p>
<section><p id="domains-warning" style="color:#a33;font-weight:bold" role="alert"></p><label for="domains">可信主域名（一行一个）</label><p><textarea id="domains" rows="4" cols="45"></textarea></p><button id="save-domains">保存可信主域名</button></section>
<table><thead><tr><th>名称</th><th>主机前缀</th><th>用户名</th><th>密码</th><th>启用</th><th>允许 HTTP</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><button id="add">添加</button><button id="save">保存</button><p id="message" role="status"></p><small>HTTPS 目标站点需要信任本机根证书。保存立即更新规则与 PAC；浏览器可能需要重新建立连接。</small>
<script>
const message=document.getElementById('message');const token=new URLSearchParams(location.search).get('token');history.replaceState(null,'','/settings');let rules=[];
async function api(path,options={}){const r=await fetch('/api/'+path,{...options,headers:{'X-Auth-Token':token,'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
function render(){const body=document.getElementById('rows');body.replaceChildren();rules.forEach((r,i)=>{let tr=document.createElement('tr');for(const key of ['name','host_prefix','username','password','enabled','allow_http']){let td=document.createElement('td'),input=document.createElement('input');input.type=key==='password'?'password':(key==='enabled'||key==='allow_http')?'checkbox':'text';if((key==='enabled'||key==='allow_http'))input.checked=!!r[key];else input.value=r[key]||'';if(key==='password')input.placeholder=r.password_error?'钥匙串读取失败（留空保留原密码项）':r.has_password?'已设置（留空保留）':'未设置';if(key==='password'&&r.password_error)input.title=r.password_error;input.oninput=()=>{r[key]=(key==='enabled'||key==='allow_http')?input.checked:input.value;if(key==='password'&&input.value)r.clear_password=false};td.append(input);tr.append(td)}let td=document.createElement('td');for(const [label,action] of [['编辑',()=>tr.querySelector('input').focus()],['删除',()=>{rules.splice(i,1);render()}],['清除密码',()=>{r.clear_password=true;r.password='';r.has_password=false;render()}],['上移',()=>{if(i){[rules[i-1],rules[i]]=[rules[i],rules[i-1]];render()}}]]){let b=document.createElement('button');b.textContent=label;b.onclick=action;td.append(b)}tr.append(td);body.append(tr)})}
document.getElementById('add').onclick=()=>{rules.push({name:'新规则',host_prefix:'feature.',username:'',enabled:true});render()};document.getElementById('save').onclick=async()=>{try{await api('rules',{method:'PUT',body:JSON.stringify(rules.map(({has_password,password_error,...r})=>r))});rules=await api('rules');render();message.textContent='已保存，规则已生效'}catch(e){message.textContent=e.message}};
const login=document.getElementById('login'),loginError=document.getElementById('login-error');
const domains=document.getElementById('domains');
async function loadDomains(){const d=await api('domains');domains.value=d.trusted_domains.join('\n');document.getElementById('domains-warning').textContent=d.trusted_domains.length?'':'⚠️ 未配置可信主域名：所有规则都不会生效。请在下方填写可信主域名（例如 example.com），只有这些域名及其子域名才会注入认证信息。'}
document.getElementById('save-domains').onclick=async()=>{try{await api('domains',{method:'PUT',body:JSON.stringify({trusted_domains:domains.value.split('\n')})});await loadDomains();message.textContent='可信主域名已保存'}catch(e){message.textContent=e.message}};
async function loadPreferences(){const p=await api('preferences');login.checked=p.launch_at_login;loginError.textContent=p.launch_at_login_error}
document.getElementById('save-login').onclick=async()=>{try{await api('preferences',{method:'PUT',body:JSON.stringify({launch_at_login:login.checked})});await loadPreferences();loginError.textContent='已保存'}catch(e){await loadPreferences();loginError.textContent=e.message}};
(async()=>{try{await loadDomains();await loadPreferences();rules=await api('rules');render();const s=await api('status');document.getElementById('status').textContent=`代理：${s.proxy_addr} ｜ CA：${s.ca_path} ｜ 系统代理：${s.system_proxy_enabled?'已启用':'已停用'}`+(s.secret_error?` ｜ ⚠️ ${s.secret_error}`:'')}catch(e){message.textContent=e.message}})();
</script></html>
